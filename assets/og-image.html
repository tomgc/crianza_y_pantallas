<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{display:flex;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#fff;overflow:hidden}
.left{width:728px;height:630px;padding:0 0 0 80px;display:flex;flex-direction:column;justify-content:center;background:#fff}
.rule{width:50px;height:6px;background:#042f4d;border-radius:3px;margin-bottom:30px}
.title{font-size:92px;line-height:1.0;font-weight:800;color:#042f4d;letter-spacing:-1.5px}
.subtitle{font-size:29px;color:#6a7280;margin-top:26px}
.spacer{height:44px}
.cert{font-size:15px;color:#6a7280;font-weight:700;letter-spacing:2px}
.legend{display:flex;gap:36px;align-items:center;margin-top:18px;font-size:24px;color:#1a1d24}
.legend span{display:flex;align-items:center;gap:11px}
.url{font-size:19px;color:#6a7280;margin-top:36px}
.dot{width:22px;height:22px;border-radius:50%;display:inline-block;box-sizing:border-box}
.high{background:#042f4d}
.medium{background:linear-gradient(90deg,#5c728e 50%,transparent 50%);border:2px solid #5c728e}
.low{background:#d6dfe8;border:1.5px solid #5c728e}
.right{width:472px;height:630px;background:#f0f2f5;display:flex;align-items:center;justify-content:center}
.grid{border:1px solid #042f4d;background:#fff}
.row{display:grid;grid-template-columns:repeat(5,1fr)}
.cog{background:#eef4fb}.soc{background:#f0f7f0}.dig{background:#f5f0fb}.bie{background:#fdf4ee}
.cell{width:66px;height:29px;display:flex;align-items:center;justify-content:center;border-right:1px solid #d4dce4;border-bottom:1px solid #d4dce4}
.cell .dot{width:14px;height:14px;border-width:1.5px}
</style></head><body>
  <div class="left">
    <div class="rule"></div>
    <div class="title">Crianza<br>y Pantallas</div>
    <div class="subtitle">Matriz de evidencia sobre crianza y pantallas</div>
    <div class="spacer"></div>
    <div class="cert">CERTEZA DE LA EVIDENCIA</div>
    <div class="legend">
      <span><i class="dot high"></i>Alta</span>
      <span><i class="dot medium"></i>Media</span>
      <span><i class="dot low"></i>Baja</span>
    </div>
    <div class="url">tomgc.github.io/crianza_y_pantallas</div>
  </div>
  <div class="right"><div class="grid">
      <div class="row cog"><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot low"></i></div></div>
      <div class="row cog"><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div></div>
      <div class="row cog"><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot low"></i></div></div>
      <div class="row soc"><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot high"></i></div></div>
      <div class="row soc"><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div></div>
      <div class="row soc"><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot low"></i></div></div>
      <div class="row soc"><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div></div>
      <div class="row dig"><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div></div>
      <div class="row dig"><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div></div>
      <div class="row dig"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot high"></i></div></div>
      <div class="row bie"><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot high"></i></div></div>
      <div class="row bie"><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div></div>
      <div class="row bie"><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div></div>
      <div class="row bie"><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot medium"></i></div><div class="cell"><i class="dot medium"></i></div></div>
      <div class="row bie"><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot low"></i></div><div class="cell"><i class="dot high"></i></div><div class="cell"><i class="dot high"></i></div></div>
      </div></div>
</body></html>
