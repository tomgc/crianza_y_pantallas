<style>
/* ─────────────────────────────────────────────────────────────
   Crianza y pantallas — sistema visual
   Base heredada de wireframe B (paleta navy, sans del sistema)
   + ampliación: top bar con tabs, layout matriz+ficha,
   vistas de página (biblio/metodología/limitaciones),
   controles, popovers, responsive.
   ───────────────────────────────────────────────────────────── */

:root {
  --bg:           #ffffff;
  --bg-soft:      #f0f2f5;
  --bg-cell:      #f9fafc;
  --ink:          #1a1d24;
  --ink-soft:     #4a5260;
  --pencil:       #6a7280;
  --pencil-soft:  #b3bac4;
  --border:       #d4dce4;

  --c-high:       #042f4d;
  --c-medium:     #5c728e;
  --c-low:        #d6dfe8;

  --accent:       #042f4d;
  --accent-soft:  #eaf0f6;
  --highlight:    #f4dd8a;
  --chile-mark:   #1f5b3d;
  --chile-soft:   #e8efe9;

  --content-width: 700px;
  --page-pad-x:    32px;
  --page-pad-y:    28px;
}

html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.ab {
  width: 100%;
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── Tipografía utilitaria ──────────────────────────────────── */
.eyebrow {
  font-size: 11.5px;
  color: var(--pencil);
  font-weight: 600;
}

/* ── Dots de certeza ────────────────────────────────────────── */
.cdot {
  display: inline-block;
  width: 12px; height: 12px;
  vertical-align: -1px;
  border-radius: 50%;
  flex-shrink: 0;
  box-sizing: border-box;
}
.cdot.high   { background: var(--c-high); }
.cdot.medium { background: linear-gradient(90deg, var(--c-medium) 50%, transparent 50%); border: 1.5px solid var(--c-medium); }
.cdot.low    { background: var(--c-low); border: 1px solid var(--c-medium); }

.ul-soft { border-bottom: 1px dotted var(--pencil); padding-bottom: 1px; }

/* ── Ref chips ──────────────────────────────────────────────── */
.ref {
  display: inline-block;
  border: 1px solid var(--c-high);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 10.5px;
  color: var(--c-high);
  cursor: pointer;
  vertical-align: 1px;
  margin: 0 2px;
  background: var(--accent-soft);
  line-height: 1.3;
  white-space: nowrap;
}
.ref:hover { background: var(--c-high); color: var(--bg); }
.ref-missing {
  background: var(--bg-soft);
  border-color: var(--pencil-soft);
  color: var(--pencil);
  cursor: help;
}

/* ── Select ─────────────────────────────────────────────────── */
.select {
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid var(--c-high);
  background: var(--bg);
  padding: 6px 28px 6px 10px;
  border-radius: 4px;
  font-size: 12.5px;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23042f4d' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-position: right 10px center;
  background-repeat: no-repeat;
  background-size: 10px 6px;
  line-height: 1.2;
}
.select:hover { border-color: var(--accent); background-color: var(--accent-soft); }

/* ── TOP BAR ────────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-soft);
  flex-wrap: wrap;
}
.topbar-left { display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap; }
.brand { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.brand-sub { color: var(--pencil); font-weight: 400; font-size: 12.5px; }
.brand-desc { font-size: 11px; color: var(--pencil); font-weight: 400; max-width: 680px; margin: 3px 0 0; line-height: 1.45; }
.tabs { display: flex; gap: 2px; }
.tab {
  background: transparent;
  border: 1px solid transparent;
  padding: 5px 12px;
  font-size: 12.5px;
  font-family: inherit;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 4px;
}
.tab:hover { background: var(--bg); color: var(--ink); }
.tab.active {
  background: var(--bg);
  color: var(--c-high);
  border-color: var(--c-high);
  font-weight: 600;
}
.topbar-right {
  display: flex; align-items: center; gap: 12px;
  font-size: 11.5px; color: var(--pencil);
  align-self: flex-end;
}
.topbar-right .legend { display: inline-flex; align-items: center; gap: 6px; }
.legend-label { font-size: 11px; color: var(--pencil); margin-right: 4px; }
.topbar-right .legend .cdot { margin-left: 4px; }

/* ── LAYOUT MATRIZ + FICHA ──────────────────────────────────── */
.matriz-body {
  display: grid;
  grid-template-columns: 1fr 380px;
  flex: 1;
  min-height: 0;
  background: var(--bg);
}
.matriz-pane {
  padding: 14px 0 16px 18px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
  overflow: auto;
  overflow-x: auto;
}
.matriz-help { font-size: 12px; color: var(--pencil); margin: 0 18px 8px 0; line-height: 1.45; }
.ficha-pane {
  border-left: 1px solid var(--border);
  background: var(--bg);
  padding: 14px 16px 18px;
  overflow: auto;
  max-height: calc(100vh - 56px);
}

/* ── MATRIZ ─────────────────────────────────────────────────── */
.matriz-grid {
  display: grid;
  border: 1px solid var(--border);
  background: var(--bg);
  margin-right: 18px;
}
.grid-cell {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 6px 7px;
  min-height: 52px;
  font-size: 10.5px;
  line-height: 1.25;
  position: relative;
  cursor: pointer;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: opacity .15s, background .15s;
  box-sizing: border-box;
}
.grid-cell:hover { background: var(--accent-soft); }

.grid-cell.row-head, .grid-cell.col-head {
  background: var(--bg-soft);
  font-weight: 600;
  cursor: default;
}
.grid-cell.row-head { align-items: flex-start; justify-content: center; flex-direction: column; }
.grid-cell.row-head[data-dim-id] { cursor: pointer; }
.dim-paper-count { font-size: 10px; font-weight: 400; color: var(--pencil); margin-top: 2px; }
.grid-cell.row-head[data-dim-id]:hover { background: var(--accent-soft); }
.grid-cell.row-head:not([data-dim-id]):hover, .grid-cell.col-head:hover { background: var(--bg-soft); }

.grid-cell.col-head {
  text-align: center;
  align-items: center;
  justify-content: center;
}
.grid-cell.col-head .head-label { font-size: 11.5px; }
.grid-cell.col-head .head-range { font-size: 10px; color: var(--pencil); font-weight: 400; margin-top: 2px; }

.grid-cell.dimmed { opacity: 0.32; }
.grid-cell.focused {
  background: var(--accent-soft);
  box-shadow: inset 0 -2px 0 var(--c-high);
}

.grid-cell.active {
  background: var(--highlight);
  box-shadow: inset 0 0 0 2px var(--c-high);
}
.grid-cell.active:hover { background: var(--highlight); }

.grid-cell.row-head.dim-active {
  background: var(--highlight);
  box-shadow: inset 0 0 0 2px var(--c-high);
}
.grid-cell.row-head.dim-active:hover { background: var(--highlight); }

/* ── Ficha de dimensión ─────────────────────────────────────── */
.dim-ficha-links { margin-top: 16px; }
.dim-ficha-link {
  display: block;
  color: var(--accent);
  text-decoration: none;
  font-size: 12px;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
}
.dim-ficha-link:last-child { border-bottom: none; }
.dim-ficha-link:hover { color: var(--ink); text-decoration: underline; }

.cell-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.cell-summary {
  font-size: 10.2px;
  color: var(--ink-soft);
  line-height: 1.25;
  margin-top: 4px;
}
.cell-empty { color: var(--pencil-soft); font-size: 11px; }

/* ── Mini-dots ──────────────────────────────────────────────── */
.mini-dot {
  width: 9px; height: 9px; border-radius: 50%;
  display: inline-block; vertical-align: middle;
  box-sizing: border-box; flex-shrink: 0;
}
.mini-dot.h { background: var(--c-high); }
.mini-dot.m { background: linear-gradient(90deg, var(--c-medium) 50%, transparent 50%); border: 1px solid var(--c-medium); }
.mini-dot.l { background: var(--c-low); border: 1px solid var(--c-medium); }

/* ── Marca CL ───────────────────────────────────────────────── */
.cl-mark {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 17px; height: 14px;
  border: 1px solid var(--chile-mark);
  border-radius: 2px;
  color: var(--chile-mark);
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
  background: var(--bg);
  letter-spacing: 0.5px;
}

/* ── Bloque Chile ───────────────────────────────────────────── */
.chile-block {
  position: relative;
  border-left: 3px solid var(--chile-mark);
  background: var(--chile-soft);
  padding: 10px 14px;
  margin-top: 14px;
  border-radius: 2px;
}
.chile-block .chile-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--chile-mark);
  margin-bottom: 6px;
}
.chile-block .chile-body { font-size: 11.8px; line-height: 1.5; }

/* ── FICHA ──────────────────────────────────────────────────── */
.ficha { display: flex; flex-direction: column; }
.ficha-empty {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 4px 0;
}
.ficha-empty-msg {
  color: var(--pencil);
  font-size: 12.5px;
  line-height: 1.5;
  padding: 18px 14px;
  border: 1px dashed var(--border);
  border-radius: 3px;
  background: var(--bg-cell);
}
.ficha-chips {
  display: flex; gap: 6px;
  align-items: center; flex-wrap: wrap;
  margin: 8px 0 0;
  font-size: 10.5px; color: var(--pencil);
}
.age-chip {
  display: inline-block;
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 11px;
  font-size: 10.5px;
  color: var(--ink-soft);
  background: var(--bg);
}
.ficha-cert {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;
  font-size: 10.5px;
}
.ficha-title {
  font-size: 16.5px;
  line-height: 1.25;
  margin: 10px 0 6px;
  font-weight: 600;
}
.ficha-intro { font-size: 12.5px; line-height: 1.55; margin: 0 0 12px; }
.ficha-evidence { margin-top: 10px; }
.evidence-list { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
.evidence-item {
  display: flex; gap: 7px;
  font-size: 11.8px; line-height: 1.5;
  align-items: flex-start;
}
.evidence-item .cdot { margin-top: 4px; flex-shrink: 0; }
.evidence-text { flex: 1; }

.ficha-defs { margin-top: 14px; }
.ficha-defs dl { margin: 6px 0 0; }
.ficha-defs dt { font-weight: 600; font-size: 12px; margin-top: 8px; }
.ficha-defs dt:first-child { margin-top: 0; }
.ficha-defs dd { margin: 2px 0 0; font-size: 11.8px; line-height: 1.5; color: var(--ink-soft); }

.ficha-and { margin-top: 14px; }
.and-body { font-size: 11.5px; margin-top: 6px; color: var(--ink-soft); line-height: 1.7; }
.and-direction { margin-top: 8px; }
.and-direction:first-of-type { margin-top: 6px; }
.and-direction-label {
  font-size: 11px;
  color: var(--ink-soft);
  font-weight: 600;
  margin-bottom: 4px;
}
.and-arrow { color: var(--c-high); font-weight: 700; margin-right: 2px; }
.and-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.and-item {
  font-size: 11.5px;
  line-height: 1.45;
  display: flex;
  gap: 6px;
  align-items: flex-start;
  color: var(--ink-soft);
}
.and-item .cdot { margin-top: 4px; flex-shrink: 0; }
.and-text { color: var(--pencil); }
.cell-link {
  color: var(--c-high);
  text-decoration: none;
  border-bottom: 1px dotted var(--c-high);
}
.cell-link:hover { background: var(--accent-soft); }

/* ── POPOVER ────────────────────────────────────────────────── */
.popover {
  background: var(--bg);
  padding: 10px 12px;
  font-size: 11.5px;
  line-height: 1.45;
  z-index: 50;
  border: 1px solid var(--c-high);
  box-shadow: 4px 4px 0 var(--c-high);
  border-radius: 2px;
}
.ref-popover .ref-authors { font-weight: 600; font-size: 12px; margin-top: 4px; }
.ref-popover .ref-title { font-size: 11.5px; margin-top: 4px; }
.ref-popover .ref-journal { font-size: 11px; color: var(--ink-soft); margin-top: 2px; font-style: italic; }
.ref-popover .ref-jump {
  display: inline-block;
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--c-high);
  text-decoration: none;
}
.ref-popover .ref-jump:hover { text-decoration: underline; }

/* ── BOTONES ────────────────────────────────────────────────── */
.ghost {
  border: 1px solid var(--c-high);
  background: transparent;
  padding: 5px 11px;
  border-radius: 3px;
  font-size: 12px;
  cursor: pointer;
  color: var(--c-high);
  font-family: inherit;
}
.ghost:hover { background: var(--accent-soft); }

/* ── VISTAS DE PÁGINA ───────────────────────────────────────── */
.page-pane {
  flex: 1;
  padding: var(--page-pad-y) var(--page-pad-x) 40px;
  max-width: var(--content-width);
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
  overflow: auto;
}
.page-head { margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
.page-sub { font-size: 12.5px; color: var(--pencil); }

/* ── BIBLIOGRAFÍA ───────────────────────────────────────────── */
.biblio-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.biblio-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-filter {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 4px 10px;
  font-size: 11.5px;
  font-family: inherit;
  border-radius: 12px;
  cursor: pointer;
  color: var(--ink-soft);
}
.chip-filter:hover { border-color: var(--c-high); color: var(--c-high); }
.chip-filter.active {
  background: var(--c-high);
  color: var(--bg);
  border-color: var(--c-high);
  font-weight: 600;
}
.search-input {
  width: 100%;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12.5px;
  font-family: inherit;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--ink);
}
.search-input:focus { outline: none; border-color: var(--c-high); }

.biblio-body { display: flex; flex-direction: column; gap: 28px; }
.biblio-group-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--c-high);
  margin: 0 0 10px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
}
.biblio-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.biblio-entry {
  border-left: 2px solid var(--border);
  padding: 6px 0 6px 12px;
  transition: border-color .2s, background .2s;
}
.biblio-entry.biblio-highlight {
  border-color: var(--highlight);
  background: var(--highlight);
}
.biblio-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 3px; }
.biblio-type {
  display: inline-block;
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 9px;
  background: var(--bg-soft);
  color: var(--ink-soft);
  border: 1px solid var(--border);
  font-weight: 600;
}
.biblio-type.type-review        { background: #e8f0e8; color: #2d5a2d; border-color: #c5d8c5; }
.biblio-type.type-meta          { background: #e8edf5; color: #1d3a6e; border-color: #c0cde2; }
.biblio-type.type-longitudinal  { background: #f5ecdb; color: #6b4a1e; border-color: #d8c290; }
.biblio-type.type-guideline     { background: #f0e8f0; color: #5c2d5c; border-color: #d4bdd4; }
.biblio-type.type-law           { background: #f5e8e8; color: #6e2d2d; border-color: #d8b8b8; }
.biblio-type.type-chilean       { background: var(--chile-soft); color: var(--chile-mark); border-color: var(--chile-mark); }
.biblio-featured { font-size: 10px; color: var(--ink-soft); }
.biblio-authors { font-size: 12px; font-weight: 600; margin-top: 2px; }
.biblio-title { font-size: 12.5px; margin-top: 2px; line-height: 1.4; }
.biblio-journal { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; font-style: italic; }
.biblio-link {
  display: inline-block;
  margin-top: 4px;
  font-size: 11px;
  color: var(--c-high);
  text-decoration: none;
}
.biblio-link:hover { text-decoration: underline; }

.empty-state {
  padding: 20px;
  text-align: center;
  color: var(--pencil);
  font-size: 12.5px;
  border: 1px dashed var(--border);
  border-radius: 4px;
}

/* ── METODOLOGÍA Y LIMITACIONES ─────────────────────────────── */
.text-body { display: flex; flex-direction: column; gap: 28px; }
.text-section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--c-high);
  margin: 0 0 10px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
}
.text-section-content { font-size: 13px; line-height: 1.65; }
.text-section-content p { margin: 0 0 10px; }
.text-section-bullets {
  margin: 10px 0 0;
  padding-left: 22px;
  font-size: 12.5px;
  line-height: 1.6;
}
.text-section-bullets li { margin-bottom: 6px; }

/* ── Boxes auxiliares ───────────────────────────────────────── */
.box.thin { border: 1px solid var(--border); border-radius: 2px; padding: 12px 14px; }
.box.fill-cell { background: var(--bg-cell); }

/* ── RESPONSIVE ─────────────────────────────────────────────── */
@media (max-width: 960px) {
  .matriz-body { grid-template-columns: 1fr; }
  .ficha-pane {
    border-left: none;
    border-top: 1px solid var(--border);
    max-height: none;
  }
  .matriz-pane { padding: 12px; }
  /* La grilla mantiene ancho minimo; .matriz-pane hace scroll horizontal */
  .matriz-grid { margin-right: 0; min-width: 520px; }
  .grid-cell { min-height: 44px; padding: 5px 6px; font-size: 10px; }
  .grid-cell.col-head .head-label { font-size: 10.5px; }
  .grid-cell.col-head .head-range { font-size: 9.5px; }
  .cell-summary { font-size: 9.8px; }
  .topbar { padding: 8px 12px; gap: 8px; }
  .topbar-left { gap: 10px; }
  .brand-sub { display: none; }
  .brand-desc { display: none; }
  .topbar-right .legend { display: none; }
  .page-title { font-size: 19px; }
  :root { --page-pad-x: 18px; --page-pad-y: 20px; }

@media (max-width: 560px) {

  .matriz-grid { min-width: 480px; }
  .grid-cell { min-height: 40px; padding: 4px; }
  .cell-summary { display: none; }
}

.gl-body {
  display: grid;
  grid-template-columns: 300px 1fr;
  flex: 1;
  min-height: 0;
}
.gl-index {
  border-right: 1px solid var(--border);
  background: var(--bg-cell);
  min-height: 0;
  overflow: auto;
}
.gl-index-scroll { padding: 14px 14px 28px; }
.gl-index-intro {
  font-size: 11px; line-height: 1.5; color: var(--pencil);
  margin: 0 0 12px;
}
.gl-index-label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--pencil); margin-bottom: 5px;
}
.gl-dim-group { margin-bottom: 14px; scroll-margin-top: 8px; }
.gl-dim-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; font-weight: 700; color: var(--c-high);
  padding: 4px 0 5px; margin-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.gl-dim-head.active { border-bottom-color: var(--c-high); border-bottom-width: 1.5px; }
.gl-dim-head.soft { color: var(--pencil); }
.gl-dim-count {
  font-size: 10px; font-weight: 600; color: var(--pencil);
  border: 1px solid var(--border); border-radius: 9px; padding: 0 6px;
}
.gl-list { display: flex; flex-direction: column; gap: 2px; }
.gl-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; text-align: left;
  background: transparent; border: none; border-radius: 4px;
  padding: 7px 9px;
  font-family: inherit; font-size: 12.5px; color: var(--ink);
  cursor: pointer; transition: background .12s;
  box-sizing: border-box;
}
.gl-item:hover { background: var(--accent-soft); }
.gl-item.active {
  background: var(--bg);
  box-shadow: inset 0 0 0 1.5px var(--c-high);
  font-weight: 600;
}
.gl-item-main { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; }
.gl-item-term { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gl-novel-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--c-high); flex-shrink: 0;
}
.gl-empty {
  padding: 16px; text-align: center; color: var(--pencil);
  font-size: 12px; border: 1px dashed var(--border);
  border-radius: 4px; margin-top: 8px;
}

/* Ficha */

  background: var(--bg); min-height: 0; overflow: auto;
  padding: var(--page-pad-y) var(--page-pad-x) 40px;

.gl-ficha-empty {
  max-width: 420px; color: var(--pencil); font-size: 13px; line-height: 1.6;
  padding: 22px; border: 1px dashed var(--border);
  border-radius: 4px; background: var(--bg-cell);
}
.gl-ficha-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gl-tag {
  font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; padding: 2px 8px; border-radius: 3px;
}
.gl-tag.campo      { background: var(--c-high); color: var(--bg); }
.gl-tag.metodo     { background: var(--bg-soft); color: var(--ink-soft); border: 1px solid var(--border); }
.gl-tag.desarrollo { background: var(--chile-soft); color: var(--chile-mark); border: 1px solid var(--chile-mark); }
.gl-novel-chip {
  font-size: 10px; font-weight: 600; color: var(--c-high);
  display: inline-flex; align-items: center; gap: 5px;
}

  content: ""; width: 6px; height: 6px;
  border-radius: 50%; background: var(--c-high);
}
.gl-ficha-cert {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; color: var(--ink-soft); margin-left: auto;
}
.gl-ficha-title {
  font-size: 22px; line-height: 1.2; font-weight: 600;
  margin: 12px 0 10px; letter-spacing: -0.01em;
}
.gl-def { font-size: 14px; line-height: 1.6; margin: 0 0 16px; }

  border-left: 3px solid var(--c-high); background: var(--accent-soft);

  font-size: 10.5px; font-weight: 700; color: var(--c-high);

.gl-cell-tramo { color: var(--pencil); font-size: 10.5px; }
.gl-papers { display: flex; flex-direction: column; gap: 8px; }
.gl-paper {

.gl-paper-authors { font-size: 11.5px; font-weight: 600; }
.gl-paper-title { font-size: 12px; line-height: 1.4; color: var(--ink-soft); }
.gl-paper-journal { font-size: 11px; color: var(--c-high); margin-top: 3px; font-style: italic; }

.gl-rel-chip:hover { background: var(--c-high); color: var(--bg); }
.gl-extlink {
  display: inline-block; font-size: 12px; color: var(--c-high);

.gl-extlink:hover { background: var(--accent-soft); }

@media (max-width: 960px) {

  .gl-ficha-title { font-size: 19px; }
}

/* ── Footer del sitio ───────────────────────────────────────── */
.site-footer {
  padding: 14px var(--page-pad-x);
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--pencil);
  display: flex;
  align-items: center;
  gap: 8px;

.footer-sep { color: var(--pencil-soft); }
.footer-link {
  color: var(--pencil);
  text-decoration: none;
  border-bottom: 1px dotted var(--pencil-soft);
}
.footer-link:hover { color: var(--ink); border-bottom-color: var(--ink); }

/* ── Nota de contacto en Metodología ───────────────────────── */
.contact-note {
  max-width: var(--content-width);
  margin: 28px var(--page-pad-x) 0;
  padding: 12px 16px;
  border-left: 2px solid var(--border);
  font-size: 12px;
  color: var(--pencil);
}
.contact-link {
  color: var(--pencil);
  text-decoration: none;
  border-bottom: 1px dotted var(--pencil-soft);
  margin-left: 4px;
}
.contact-link:hover { color: var(--ink); }

    "privacidad-ninez-media": {
      "claims": [
        {
          "text": "El reporte de material de abuso sexual infantil (CSAM) creció un 87% desde 2019, con más de 32 millones de reportes globales. Las imágenes autogeneradas de niños de 7–10 años aumentaron un 360% entre 2020 y 2022. Estas cifras son datos administrativos de reportes, no prevalencia poblacional.",

          "refs": [
            "WeProtect2023"

        {
          "text": "La exposición a contenido sexual en línea se asocia con mayor riesgo de comportamientos sexuales problemáticos en niños y adolescentes (rango etario desde 4,74 años). Los autores la identifican como factor de riesgo relevante dada la ubicuidad del acceso tecnológico.",
          "certainty": "medium",
          "refs": [
            "Mori2023"
          ]
        },
        {
          "text": "La mayoría de los programas de seguridad online para jóvenes enseñan reglas con débil base empírica. La mejora en conocimiento declarado no equivale a reducción de victimización real; los programas deben alinearse con principios de prevención basada en evidencia.",

          "refs": [
            "Finkelhor2021"

        {
          "text": "Las intervenciones de seguridad digital para cuidadores producen efecto significativo en la reducción del tiempo de pantalla infantil (Hedges g=−0,47 en ECAs). El conocimiento y las actitudes parentales mejoran, aunque los desenlaces de victimización sexual real no fueron medidos.",

          "refs": [

      "summary": "Grooming y contacto no seguro",
      "intro": "Con acceso independiente a dispositivos aumenta el riesgo de contacto con adultos desconocidos. El grooming y la explotación sexual en línea (OCSEA) son más frecuentes de lo que los padres estiman; la mayoría de víctimas son mayores de 10 años."
    },
    "privacidad-preadolescencia": {
      "claims": [
        {
          "text": "La prevalencia mundial de explotación y abuso sexual online de menores (OCSEA) en el último año es del 8,1% (IC95% 4,9–13,0), con subtipos que incluyen solicitud online (12,5%), imágenes no consensuales (12,6%), explotación sexual (4,7%) y sextorsión (3,5%). La mayoría de los estudios incluidos miden adolescentes; la aplicabilidad estricta a 9–12 años requiere cautela.",
          "certainty": "medium",
          "refs": [
            "Fry2025"
          ]
        },
        {
          "text": "El cybergrooming afecta a personas desde los 5 años, con tasas de prevalencia de entre el 10% y el 20% para periodos de hasta un año. Los factores de riesgo documentados incluyen tiempo online, número de plataformas usadas y menor supervisión parental.",

          "refs": [
            "Schittenhelm2024"

        {
          "text": "El 68% de los perpetradores de delitos online contra menores son conocidos o familiares (IC95% 62–75%), y el 44% son menores de 18 años (IC95% 28–60%). Este hallazgo cuestiona el marco de 'stranger danger' y orienta la prevención hacia el entorno cercano del niño.",

          "refs": [
            "Sutton2024"
          ]

        {
          "text": "Las conversaciones en plataformas de videojuegos pueden escalar a situaciones de grooming en 19 segundos, con un tiempo medio de grooming de 45 minutos. En Brasil, 1 de cada 5 adolescentes de 12–17 años (19%) reportó haber sido víctima de explotación sexual facilitada por tecnología en el último año.",
          "certainty": "medium",
          "refs": [
            "WeProtect2023",
            "DisruptingHarmBrasil2026"
          ]

        {
          "text": "La sextorsión financiera muestra crecimiento acelerado: NCMEC recibió 26.718 reportes en 2023 frente a 10.731 en 2022. Afecta predominantemente a adolescentes varones de 14–17 años; la aplicabilidad directa a preadolescentes de 9–12 es limitada.",
          "certainty": "medium",
          "refs": [
            "ThornNCMEC2024"

          "text": "En EE.UU., el 5,4% de los jóvenes reportó grooming online por adultos antes de los 18 años, y el 3,5% reportó sextorsión. La edad de mayor vulnerabilidad fue 13–17 años; la aplicabilidad al tramo 9–12 es inferida, no medida directamente.",

    "cyberbullying-ninez-media": {
      "claims": [
        {
          "text": "La cybervictimización en primaria (8–12 años) se asocia con peor salud mental. La mayoría de los cibervíctimas también sufren bullying tradicional presencial, lo que confunde la estimación de efectos aislados. Este estudio es uno de los pocos que aborda específicamente primaria controlando bullying presencial.",

          "text": "Los factores parentales protectores —calidez, monitoreo, mediación activa— se asocian a menor cybervictimización (r=−0,11; IC95% −0,15 a −0,08), y los factores de riesgo parentales se asocian a mayor exposición (r=0,16). Los effect sizes son pequeños pero consistentes a través de 158 estudios y más de un millón de participantes.",

          "text": "La asociación longitudinal entre victimización por cyberbullying y síntomas de salud mental fue débilmente positiva y consistente a lo largo del tiempo. La victimización aumenta progresivamente desde 6,4% en 6º grado hasta 11,6% en 10º grado.",
          "certainty": "medium",
          "refs": [
            "Lee2026"
          ]

      "certainty": "medium",
      "summary": "Inicio con dispositivo propio",
      "intro": "El cyberbullying emerge cuando los niños acceden a dispositivos propios y plataformas de pares, típicamente alrededor de los 9–10 años. La evidencia en niñez media es menor que en preadolescencia; el factor protector más consistente es el monitoreo parental."
    },
    "cyberbullying-preadolescencia": {
      "claims": [
        {
          "text": "La tasa media de victimización por cyberbullying en niños y adolescentes es del 11,10% (IC95% 9,12–13,44%), con variación entre 2% y 72% según región. El cyberbullying es menos prevalente que el bullying tradicional pero altamente correlacionado con él.",

          "refs": [
            "Li2024"
          ]
        },
        {
          "text": "La victimización por cyberbullying a los 11–12 años se asocia prospectivamente con mayores odds de experimentación con alcohol (AOR 1,98; IC95% 1,53–2,57), nicotina (AOR 3,37; IC95% 2,16–5,26) y cannabis (AOR 4,65; IC95% 2,46–8,77) un año después, además de síntomas depresivos y conductas suicidas.",
          "certainty": "high",
          "refs": [
            "Nagata2025c"
          ]
        },
        {
          "text": "El cyberbullying muestra efectos longitudinales recíprocos: la perpetración predice problemas externalizantes y la victimización constituye factor de riesgo de problemas internalizantes (depresión, ansiedad). La relación bidireccional víctima-agresor es un hallazgo consistente en estudios longitudinales.",
          "certainty": "medium",
          "refs": [
            "Marciano2020"
          ]
        },
        {
          "text": "El apoyo familiar y el monitoreo parental se asocian a menor cybervictimización (mediana r=−0,08; rango −0,18 a 0,01) y los entornos familiares adversos a mayor exposición (mediana r=0,20; rango 0,16 a 0,24). Ningún factor individual produce protección grande; se requieren enfoques multinivel.",
          "certainty": "medium",
          "refs": [
            "Kasturiratna2024"
          ]
        },
        {
          "text": "Los programas escolares reducen significativamente la perpetración (g=−0,18; IC95% −0,28 a −0,09) y la victimización (g=−0,13; IC95% −0,21 a −0,05) de cyberbullying. Un programa general de prevención de violencia tuvo la misma probabilidad de ser efectivo que uno específico de cyberbullying.",
          "certainty": "medium",
          "refs": [
            "Polanin2022"
          ]
        },
        {
          "text": "El 15% de adolescentes de 11 años reportó haber sido víctima de cyberbullying (15% varones, 16% mujeres), con pico de victimización en varones a los 11 años. El cyberbullying aumentó desde 2018 mientras el bullying escolar tradicional se mantuvo estable.",

          "refs": [
            "WHO-HBSC2024"

          "text": "En Brasil, el 13,2% (IC95% 12,8–13,7) de los escolares reportó cyberbullying, con mayor prevalencia en mujeres (16,2%) y menor con supervisión parental (RP=0,78). Nota: rango etario 13–17 años, por encima del tramo objetivo.",

    },

      const refs = new Set();
      ages.forEach(a => {
        const cell = claims[`${d.id}-${a.id}`];
        if (cell) (cell.claims || []).forEach(c => (c.refs || []).forEach(r => refs.add(r)));
      });
      paperCountByDim[d.id] = refs.size;
    });

    // Filas: dimension + 5 celdas
    dims.forEach(d => {
      const pc = paperCountByDim[d.id];
      const dimDesc = DIM_DESCRIPTIONS[d.id];
      const tooltipAttr = dimDesc ? ` data-dim-id="${escapeHtml(d.id)}"` : "";
      const bloqueClass = DIM_BLOCKS[d.id] ? ` ${DIM_BLOCKS[d.id]}` : "";
      const dimActive = state.activeDim === d.id ? " dim-active" : "";
      html += `<div class="grid-cell row-head${bloqueClass}${dimActive}"${tooltipAttr}><span>${escapeHtml(d.label)}</span>${pc > 0 ? `<span class="dim-paper-count">(${pc} ${pc === 1 ? "referencia" : "referencias"})</span>` : ""}</div>`;
      ages.forEach(a => {
        const cid = `${d.id}-${a.id}`;
        const cell = claims[cid];
        const dimmed = ageSel !== "all" && ageSel !== a.id;
        const isActive = cid === state.activeCell;
        const cls = ["grid-cell", "data-cell", dimmed ? "dimmed" : "", isActive ? "active" : ""].filter(Boolean).join(" ");

        if (!cell || !(cell.claims && cell.claims.length)) {
          html += `<div class="${cls}" data-cellid="${cid}"><div class="cell-empty">—</div></div>`;
          return;
        }

        const dot = certLetter(cell.certainty);
        const hasChile = !!cell.chile_note;
        const summary = cell.summary || "";

        html += `
          <div class="${cls}" data-cellid="${cid}">
            <div class="cell-head">
              <span class="mini-dot ${dot}"></span>
              ${hasChile ? `<span class="cl-mark" title="Tiene nota de contexto chileno">CL</span>` : ""}
            </div>
            <div class="cell-summary">${escapeHtml(summary)}</div>
          </div>`;
      });
    });

    html += `</div>`;
    return html;
  }

  // ── FICHA DE CELDA ──────────────────────────────────────────
  function renderFicha(cellId) {
    if (!cellId || !claims[cellId] || !claims[cellId].claims?.length) {
      return `
        <div class="ficha-empty">
          <div class="eyebrow">Ficha activa</div>
          <div class="ficha-empty-msg">
            Haz clic en cualquier celda de la matriz para abrir su ficha de evidencia.
          </div>
        </div>
      `;
    }
    const cell = claims[cellId];
    const { dimId, ageId } = splitCellId(cellId);
    const dim = dims.find(d => d.id === dimId) || { label: dimId };
    const age = ages.find(a => a.id === ageId) || { label: ageId, range: "" };
    const cert = cell.certainty || "low";
    const certLab = certaintyLabels[cert] || cert;

    return `
      <div class="ficha">
        <div class="eyebrow">Ficha activa</div>

        <div class="ficha-chips">
          <span class="age-chip">${escapeHtml(dim.label)}</span>
          <span class="age-chip">${escapeHtml(age.label)} · ${escapeHtml(age.range)}</span>
          <span class="ficha-cert">
            <span class="cdot ${cert}"></span>certeza ${escapeHtml(certLab.toLowerCase())}
          </span>
        </div>

        <h2 class="ficha-title">${escapeHtml(cell.summary || "")}</h2>

        ${cell.intro ? `<p class="ficha-intro">${fmt(cell.intro)}</p>` : ""}

        ${renderFichaClaims(cell.claims || [])}

        ${cell.definitions ? renderFichaDefinitions(cell.definitions) : ""}

        ${cell.chile_note ? `
          <div class="chile-block">
            <div class="chile-label"><span class="cl-mark">CL</span>Contexto chileno</div>
            <div class="chile-body">${fmt(cell.chile_note)}</div>
          </div>
        ` : ""}

        ${cell.andamiaje ? renderFichaAndamiaje(cell.andamiaje) : ""}
      </div>
    `;
  }

  function renderFichaClaims(arr) {
    if (!arr.length) return "";
    return `
      <div class="ficha-evidence">
        <div class="eyebrow">Evidencia (${arr.length})</div>
        <div class="evidence-list">
          ${arr.map(c => {
            const cert = c.certainty || "low";
            const refs = (c.refs || []).map(r => renderRefChip(r)).join("");
            return `
              <div class="evidence-item">
                <span class="cdot ${cert}"></span>
                <span class="evidence-text">${fmt(c.text)}${refs}</span>
              </div>`;
          }).join("")}
        </div>
      </div>
    `;
  }

  function renderFichaDefinitions(defs) {
    // defs es array de {term, body} (estructura real en claims.json)
    let items = [];
    if (Array.isArray(defs)) {
      items = defs.map(d => ({
        term: d.term,
        body: d.body || d.definition || d.text || ""
      }));
    } else if (defs && typeof defs === "object") {
      items = Object.entries(defs).map(([term, body]) => ({ term, body }));
    }
    if (!items.length) return "";
    return `
      <div class="ficha-defs">
        <div class="eyebrow">Definiciones</div>
        <dl>
          ${items.map(d => `
            <dt>${escapeHtml(d.term)}</dt>
            <dd>${fmt(d.body)}</dd>
          `).join("")}
        </dl>
      </div>
    `;
  }

  function renderFichaAndamiaje(and) {
    // Estructura real: {upstream: [{to, certainty, text}], downstream: [{to, certainty, text}]}
    if (!and || typeof and !== "object") return "";
    const up = Array.isArray(and.upstream)   ? and.upstream   : [];
    const down = Array.isArray(and.downstream) ? and.downstream : [];
    if (!up.length && !down.length) return "";

    const renderArrow = (items, arrow, label) => {
      if (!items.length) return "";
      return `
        <div class="and-direction">
          <div class="and-direction-label"><span class="and-arrow">${arrow}</span> ${escapeHtml(label)}</div>
          <ul class="and-list">
            ${items.map(it => `
              <li class="and-item">
                <span class="cdot ${it.certainty || "low"}"></span>
                ${linkToCell(it.to)}
                ${it.text ? `<span class="and-text">— ${escapeHtml(it.text)}</span>` : ""}
              </li>
            `).join("")}
          </ul>
        </div>
      `;
    };

    return `
      <div class="ficha-and">
        <div class="eyebrow">Andamiaje del desarrollo</div>
        ${renderArrow(up,   "↑", "Se apoya en")}
        ${renderArrow(down, "↓", "Alimenta a")}
      </div>
    `;
  }

  function linkToCell(cid) {
    if (typeof cid !== "string") return "";
    const { dimId, ageId } = splitCellId(cid);
    const dim = dims.find(d => d.id === dimId);
    const age = ages.find(a => a.id === ageId);
    if (!dim || !age) return escapeHtml(cid);
    return `<a href="#" class="cell-link" data-cellid="${cid}">${escapeHtml(dim.label)} · ${escapeHtml(age.label)}</a>`;
  }

  function renderRefChip(refId) {
    const b = biblioById[refId];
    if (!b) return `<span class="ref ref-missing" title="Referencia no encontrada: ${escapeHtml(refId)}">?</span>`;
    // Etiqueta corta: primer autor + año
    const label = shortLabel(b);
    return `<span class="ref" data-refid="${escapeHtml(refId)}" title="${escapeHtml(label)}">${escapeHtml(label)}</span>`;
  }

  function shortLabel(b) {
    if (!b) return "?";
    const authors = b.authors || "";
    // Año: último match de 4 dígitos en authors o journal
    const yearMatches = (authors.match(/\b(19|20)\d{2}\b/g) || []);
    const year = yearMatches.length
      ? yearMatches[yearMatches.length - 1]
      : ((b.journal || "").match(/\b(19|20)\d{2}\b/) || [""])[0];

    // Primer apellido: tomar lo anterior a la primera inicial o coma
    // Patrones típicos: "Apellido X.Y., Otro...", "Apellido X. y col. 2024",
    // "Early Years Screen Time Advisory Group (EYSTAG). 2026"
    let primary = authors.split(/\s\d{4}\b/)[0]; // descartar año al final
    // Cortar en el primer ", " (coautor) o en " y col" o en " et al"
    primary = primary.split(/, | y col| et al/i)[0].trim();
    // Si tiene inicial al final como "Apellido X." o "Apellido X.Y.", dejarla
    primary = primary.replace(/\s*$/, "");
    if (!primary) primary = b.id;

    // Si hay más de un autor, agregar "et al."
    const multipleAuthors = /,| y col| et al/i.test(authors);
    const etAl = multipleAuthors ? " et al." : "";

    return year ? `${primary}${etAl} ${year}` : `${primary}${etAl}`;
  }

  function splitCellId(cid) {
    // Soporta ages compuestos (primera-infancia, ninez-media, salud-mental, etc.)
    for (const a of ages) {
      const suffix = "-" + a.id;
      if (cid.endsWith(suffix)) {
        return { dimId: cid.slice(0, -suffix.length), ageId: a.id };
      }
    }
    const i = cid.lastIndexOf("-");
    return { dimId: cid.slice(0, i), ageId: cid.slice(i + 1) };
  }

      <div class="gl-ficha">
        <div class="gl-ficha-chips">
          <span class="gl-tag ${term.grupo}">${escapeHtml(g.tag)}</span>
          ${term.novel ? `<span class="gl-novel-chip">Concepto destacado</span>` : ""}
          ${headCert ? `
            <span class="gl-ficha-cert">
              <span class="cdot ${headCert}"></span>certeza ${certLabels[headCert]}
            </span>
          ` : ""}
        </div>
        <h2 class="gl-ficha-title">${escapeHtml(term.term)}</h2>
        <p class="gl-def">${escapeHtml(term.def)}</p>
        <div class="gl-why">
          <div class="gl-why-label">Por qué importa</div>
          <p class="gl-why-text">${escapeHtml(term.why)}</p>
        </div>
        ${cellsHtml}
        ${papersHtml}
        ${relatedHtml}
      </div>
    `;
  }

  function renderBibliografia() {
    const q = state.biblioSearch.toLowerCase().trim();
    const f = state.biblioFilter;

    // Filtrado
    const filtered = biblio.filter(b => {
      if (f !== "all") {
        if (f === "featured" && !b.featured) return false;
        if (f !== "featured" && b.type !== f) return false;
      }
      if (q) {
        const hay = `${b.authors || ""} ${b.title || ""} ${b.journal || ""} ${b.id || ""}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    // Agrupar por biblioGroups (en orden declarado)
    const byGroup = {};
    filtered.forEach(b => {
      const g = b.group || "other";
      (byGroup[g] = byGroup[g] || []).push(b);
    });
    const orderedGroups = biblioGroups.filter(g => byGroup[g.id] && byGroup[g.id].length);

    return `
      <div class="page-pane">
        <div class="page-head">
          <h1 class="page-title">Bibliografía</h1>
          <div class="page-sub">${filtered.length} de ${biblio.length} entradas</div>
        </div>

        <div class="biblio-controls">
          <div class="biblio-filters">
            ${filterTypes.map(f => `
              <button class="chip-filter ${f.id === state.biblioFilter ? "active" : ""}" data-filter="${f.id}">
                ${escapeHtml(f.label)}
              </button>
            `).join("")}
          </div>
          <input type="search" id="biblio-search" class="search-input"
                 placeholder="Buscar por autor, título o revista…"
                 value="${escapeHtml(state.biblioSearch)}">
        </div>

        <div class="biblio-body">
          ${orderedGroups.length === 0
            ? `<div class="empty-state">No hay entradas que coincidan con el filtro.</div>`
            : orderedGroups.map(g => renderBiblioGroup(g, byGroup[g.id])).join("")
          }
        </div>
      </div>
    `;
  }

  function renderBiblioGroup(group, entries) {
    return `
      <section class="biblio-group">
        <h2 class="biblio-group-title">${escapeHtml(group.label)}</h2>
        <ul class="biblio-list">
          ${entries.map(renderBiblioEntry).join("")}
        </ul>
      </section>
    `;
  }

  function renderBiblioEntry(b) {
    const t = biblioTypes[b.type] || { label: b.type || "", cls: "" };
    const featured = b.featured ? `<span class="biblio-featured">★ destacada</span>` : "";
    const url = b.url ? `<a class="biblio-link" href="${escapeHtml(b.url)}" target="_blank" rel="noopener">↗ enlace</a>` : "";
    return `
      <li class="biblio-entry" id="ref-${escapeHtml(b.id)}">
        <div class="biblio-meta">
          <span class="biblio-type ${t.cls}">${escapeHtml(t.label)}</span>
          ${featured}
        </div>
        <div class="biblio-authors">${escapeHtml(b.authors || "")}</div>
        <div class="biblio-title">${escapeHtml(b.title || "")}</div>
        ${b.journal ? `<div class="biblio-journal">${escapeHtml(b.journal)}</div>` : ""}
        ${url}
      </li>
    `;
  }

  // ── VISTA: METODOLOGÍA Y LIMITACIONES ───────────────────────
  function renderMetodologia() {
    const metodoSections = (methodology.sections || [])
      .filter(s => s.heading !== "Decisiones editoriales");
    const limitSections  = limitations.sections || [];
    const merged = {
      title:    "Cómo leemos la evidencia",
      subtitle: "Criterios, tramos etarios y niveles de certeza que organizan esta síntesis.",
      sections: [...metodoSections, ...limitSections]
    };
    return renderTextPage(merged) + `
      <div class="contact-note">
        ¿Encuentras un error o quieres sugerir una fuente?
        <a href="&#109;&#97;&#105;&#108;&#116;&#111;&#58;&#116;&#103;&#111;&#110;&#122;&#97;&#108;&#101;&#122;&#64;&#103;&#109;&#97;&#105;&#108;&#46;&#99;&#111;&#109;" class="contact-link">Escríbeme.</a>
      </div>`;
  }
  function renderLimitaciones() { return renderMetodologia(); }

  function renderTextPage(page) {
    return `
      <div class="page-pane">
        <div class="page-head">
          <h1 class="page-title">${escapeHtml(page.title || "")}</h1>
          ${page.subtitle ? `<div class="page-sub">${escapeHtml(page.subtitle)}</div>` : ""}
        </div>
        <div class="text-body">
          ${(page.sections || []).map(renderTextSection).join("")}
        </div>
      </div>
    `;
  }

  function renderTextSection(sec) {
    return `
      <section class="text-section">
        <h2 class="text-section-title">${escapeHtml(sec.heading || "")}</h2>
        ${sec.content ? `<div class="text-section-content">${fmt(sec.content)}</div>` : ""}
        ${(sec.bullets && sec.bullets.length)
          ? `<ul class="text-section-bullets">${sec.bullets.map(b => `<li>${fmt(b)}</li>`).join("")}</ul>`
          : ""
        }
      </section>
    `;
  }

  // ── POPOVER DE REFERENCIA ───────────────────────────────────
  // ── FICHA DE DIMENSIÓN ──────────────────────────────────────
  function renderFichaDim(dimId) {
    const desc = DIM_DESCRIPTIONS[dimId];
    const dim  = dims.find(d => d.id === dimId) || { label: dimId };
    if (!desc) return renderFicha(null);
    const linksHtml = (desc.links || []).map(l =>
      `<a class="dim-ficha-link" href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.label)}</a>`
    ).join("");
    return `
      <div class="ficha">
        <div class="eyebrow">Dimensión</div>
        <div class="ficha-chips">
          <span class="age-chip">${escapeHtml(dim.label)}</span>
        </div>
        <p class="ficha-intro">${escapeHtml(desc.text)}</p>
        ${linksHtml ? `
          <div class="dim-ficha-links">
            <div class="eyebrow" style="margin-bottom:6px;">Leer más</div>
            ${linksHtml}
          </div>` : ""}
      </div>
    `;
  }

  function openDimFicha(dimId) {
    state.activeDim = dimId;
    state.activeCell = null;
    const matrizPane = root.querySelector(".matriz-pane");
    const fichaPane  = root.querySelector("#ficha-pane");
    if (matrizPane) matrizPane.innerHTML = renderMatrizHelp() + renderMatriz();
    if (fichaPane)  fichaPane.innerHTML  = renderFichaDim(dimId);
  }

  function showRefPopover(refId, anchorEl) {
    closePopover();
    const b = biblioById[refId];
    if (!b) return;
    const pop = document.createElement("div");
    pop.className = "popover ref-popover";
    pop.innerHTML = `
      <div class="eyebrow">Referencia</div>
      <div class="ref-authors">${escapeHtml(b.authors || "")}</div>
      <div class="ref-title">${escapeHtml(b.title || "")}</div>
      ${b.journal ? `<div class="ref-journal">${escapeHtml(b.journal)}</div>` : ""}
      <a href="#" class="ref-jump" data-jump="${escapeHtml(b.id)}">↗ Ver en bibliografía</a>
    `;
    document.body.appendChild(pop);
    positionPopover(pop, anchorEl);
    pop.dataset.opened = "1";
  }

  function positionPopover(pop, anchor) {
    const r = anchor.getBoundingClientRect();
    const popW = 260;
    const pad = 8;
    let left = r.right + pad;
    if (left + popW > window.innerWidth - 8) {
      left = r.left - popW - pad;
    }
    if (left < 8) left = 8;
    let top = r.top + window.scrollY;
    pop.style.position = "absolute";
    pop.style.left = left + "px";
    pop.style.top = top + "px";
    pop.style.width = popW + "px";
  }

  function closePopover() {
    document.querySelectorAll(".ref-popover").forEach(el => el.remove());
  }

  // ── EVENTOS ─────────────────────────────────────────────────
  function bindGlobalEvents() {
    root.addEventListener("click", onRootClick);
    root.addEventListener("change", onRootChange);
    document.addEventListener("click", onDocClick, true);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closePopover(); }
    });
    root.addEventListener("input", onRootInput);
  }

  function onRootClick(e) {
    // Tab
    const tab = e.target.closest("[data-tab]");
    if (tab) {
      state.view = tab.dataset.tab;
      closePopover();
      rerenderView();
      return;
    }

    // Clic en label de dimensión → ficha de definición
    const rowHead = e.target.closest(".grid-cell.row-head[data-dim-id]");
    if (rowHead) {
      openDimFicha(rowHead.dataset.dimId);
      return;
    }

    // Celda de matriz
    const cellEl = e.target.closest(".data-cell[data-cellid]");
    if (cellEl) {
      const cid = cellEl.dataset.cellid;
      if (claims[cid]) {
        state.activeCell = cid;
        state.activeDim = null;
        // Re-render solo de la matriz (para active class) y de la ficha
        const matrizPane = root.querySelector(".matriz-pane");
        const fichaPane  = root.querySelector("#ficha-pane");
        if (matrizPane) matrizPane.innerHTML = renderMatrizHelp() + renderMatriz();
        if (fichaPane)  fichaPane.innerHTML  = renderFicha(state.activeCell);
      }
      return;
    }

    // Link a celda (desde andamiaje en ficha)
    const cellLink = e.target.closest(".cell-link[data-cellid]");
    if (cellLink) {
      e.preventDefault();
      const cid = cellLink.dataset.cellid;
      if (claims[cid]) {
        state.activeCell = cid;
        if (state.view !== "matriz") {
          state.view = "matriz";
          rerenderView();
        } else {
          const matrizPane = root.querySelector(".matriz-pane");
          const fichaPane  = root.querySelector("#ficha-pane");
          if (matrizPane) matrizPane.innerHTML = renderMatrizHelp() + renderMatriz();
          if (fichaPane)  fichaPane.innerHTML  = renderFicha(state.activeCell);
        }
      }
      return;
    }

    // Ref chip
    const refEl = e.target.closest(".ref[data-refid]");
    if (refEl) {
      e.preventDefault();
      e.stopPropagation();
      const id = refEl.dataset.refid;
      // Si ya hay popover abierto para esta ref, cerrar
      const open = document.querySelector(".ref-popover");
      if (open && open.dataset.refid === id) {
        closePopover();
      } else {
        showRefPopover(id, refEl);
        const pop = document.querySelector(".ref-popover");
        if (pop) pop.dataset.refid = id;
      }
      return;
    }

    // Filtro de bibliografía
    const filterBtn = e.target.closest("[data-filter]");
    if (filterBtn) {
      state.biblioFilter = filterBtn.dataset.filter;
      rerenderView();
      return;
    }

    // Término del índice del glosario
    const glTerm = e.target.closest("[data-gl-term]");
    if (glTerm) {
      state.glosarioSel = glTerm.dataset.glTerm;
      const idx = document.getElementById("gl-index");
      const ficha = document.getElementById("gl-ficha-pane");
      if (idx)   idx.innerHTML   = renderGlosarioIndex(window.GLOSARIO);
      if (ficha) ficha.innerHTML = renderGlosarioFicha(window.GLOSARIO, state.glosarioSel);
      return;
    }

    // Chip de término relacionado en ficha del glosario
    const glRel = e.target.closest("[data-gl-rel]");
    if (glRel) {
      state.glosarioSel = glRel.dataset.glRel;
      const idx = document.getElementById("gl-index");
      const ficha = document.getElementById("gl-ficha-pane");
      if (idx)   idx.innerHTML   = renderGlosarioIndex(window.GLOSARIO);
      if (ficha) ficha.innerHTML = renderGlosarioFicha(window.GLOSARIO, state.glosarioSel);
      // Scroll al término activo en el índice
      setTimeout(() => {
        const active = document.querySelector(".gl-item.active");
        if (active) active.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, 30);
      return;
    }

    // Salto desde popover a entrada de biblio
    const jumpEl = e.target.closest("[data-jump]");
    if (jumpEl) {
      e.preventDefault();
      const id = jumpEl.dataset.jump;
      closePopover();
      state.view = "bibliografia";
      state.biblioFilter = "all";
      state.biblioSearch = "";
      rerenderView();
      setTimeout(() => {
        const target = document.getElementById(`ref-${id}`);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "center" });
          target.classList.add("biblio-highlight");
          setTimeout(() => target.classList.remove("biblio-highlight"), 1800);
        }
      }, 30);
    }
  }

  function onRootChange(e) {
  }

  function onRootInput(e) {
    if (e.target.id === "biblio-search") {
      state.biblioSearch = e.target.value;
      // Re-render solo del cuerpo de bibliografía (no del input para no perder foco)
      const body = root.querySelector(".biblio-body");
      if (!body) return;
      const q = state.biblioSearch.toLowerCase().trim();
      const f = state.biblioFilter;
      const filtered = biblio.filter(b => {
        if (f !== "all") {
          if (f === "featured" && !b.featured) return false;
          if (f !== "featured" && b.type !== f) return false;
        }
        if (q) {
          const hay = `${b.authors || ""} ${b.title || ""} ${b.journal || ""} ${b.id || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      const byGroup = {};
      filtered.forEach(b => { (byGroup[b.group] = byGroup[b.group] || []).push(b); });
      const ordered = biblioGroups.filter(g => byGroup[g.id] && byGroup[g.id].length);
      body.innerHTML = ordered.length === 0
        ? `<div class="empty-state">No hay entradas que coincidan con la búsqueda.</div>`
        : ordered.map(g => renderBiblioGroup(g, byGroup[g.id])).join("");
      // Actualizar contador
      const sub = root.querySelector(".page-sub");
      if (sub) sub.textContent = `${filtered.length} de ${biblio.length} entradas`;
    }
  }

  function onDocClick(e) {
    // Cerrar popover si se hace click fuera
    if (e.target.closest(".ref-popover")) return;
    if (e.target.closest(".ref[data-refid]")) return;
    closePopover();
  }

  // ── INIT ────────────────────────────────────────────────────
  mount();
})();

</script>
