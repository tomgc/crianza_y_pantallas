    background-repeat: no-repeat;
    background-size: 10px 6px;
    line-height: 1.2;
  }
  .select:hover { border-color: var(--accent); background-color: var(--accent-soft); }

  .grid-cell {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px 7px;
    min-height: 48px;
    font-size: 10.5px;
    line-height: 1.25;
    position: relative;
    cursor: pointer;
    background: var(--bg);
  }
  .grid-cell:hover { background: var(--accent-soft); }
  .grid-cell.row-head, .grid-cell.col-head {
    background: var(--bg-soft);
    font-weight: 600;
  }
  .grid-cell.row-head:hover, .grid-cell.col-head:hover { background: var(--bg-soft); cursor: default; }
  .grid-cell.active {
    background: var(--highlight);
    box-shadow: inset 0 0 0 2px var(--c-high);
  }
  .grid-cell .mini-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; vertical-align: middle;
    box-sizing: border-box;
  }
  .grid-cell .mini-dot.h { background: var(--c-high); }
  .grid-cell .mini-dot.m { background: linear-gradient(90deg, var(--c-medium) 50%, transparent 50%); border:1px solid var(--c-medium); }
  .grid-cell .mini-dot.l { background: var(--c-low); border: 1px solid var(--c-medium); }

  .cl-mark {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 16px; height: 14px;
    border: 1px solid var(--chile-mark);
    border-radius: 2px;
    color: var(--chile-mark);
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    background: var(--bg);
  }

  .popover {
    position: absolute;
    background: var(--bg);
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.45;
    max-width: 240px;
    z-index: 5;
    border: 1px solid var(--c-high);
    box-shadow: 4px 4px 0 var(--c-high);
    border-radius: 2px;
  }

    display: inline-block;
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 11px;
    font-size: 10.5px;
    color: var(--ink-soft);
    background: var(--bg);
  }

  .ghost {
    border: 1px solid var(--c-high);
    background: transparent;
    padding: 5px 11px;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
    color: var(--c-high);
    font-family: inherit;
  }

  .chile-block {
    position: relative;
    border-left: 3px solid var(--chile-mark);
    background: var(--chile-soft);
    padding: 12px 16px 12px 18px;
  }
  .chile-block .chile-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--chile-mark);
    margin-bottom: 6px;
  }
  .chile-block .chile-label::before {
    content: "";
    width: 8px; height: 8px;
    background: var(--chile-mark);
    border-radius: 50%;
  }

  .box.thin { border: 1px solid var(--border); border-radius: 2px; padding: 12px 14px; }
  .box.fill-cell { background: var(--bg-cell); }

</style>
